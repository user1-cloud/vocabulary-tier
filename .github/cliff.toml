# git-cliff 配置：从 conventional commits 生成 changelog（release.yml 使用）

[changelog]
header = """
# Changelog

本文件由 git-cliff 根据 conventional commits 自动生成。
"""

body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}
{% endfor %}
{% endfor %}
"""

trim = true
footer = """
<!-- generated by git-cliff -->
"""

[git]
conventional_commits = true
commit_parsers = [
    { message = "^feat", group = "Features（新功能）" },
    { message = "^fix", group = "Bug Fixes（修复）" },
    { message = "^perf", group = "Performance（性能）" },
    { message = "^refactor", group = "Refactor（重构）" },
    { message = "^docs", group = "Documentation（文档）" },
    { message = "^chore", group = "Chores（杂项）" },
    { message = "^build", group = "Build（构建）" },
    { message = "^ci", group = "CI/CD" },
    { message = "^test", group = "Tests（测试）" },
    { message = ".*", group = "Other（其他）" },
]
filter_commits = false
