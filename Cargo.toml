[workspace]
resolver = "3"
members = ["crates/vocfreq-core", "crates/vocfreq-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/local/VocTier"

[workspace.dependencies]
jieba-rs = "0.11"
rayon = "1"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memmap2 = "0.9"
clap = { version = "4", features = ["derive"] }
walkdir = "2"
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "none"

# 全库统计是长任务，调试构建太慢，这里给 dev 也开优化
[profile.dev]
opt-level = 1
