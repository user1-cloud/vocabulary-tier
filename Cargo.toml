[workspace]
resolver = "3"
members = ["crates/vocfreq-core", "crates/vocfreq-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/local/VocTier"

[workspace.dependencies]
# ⚠ 必须关掉 default feature `default-dict`：它会把 jieba 的 dict.txt（4.84 MB）用
# include-flate 以 zstd 压进**每个**链接了本库的二进制里，同时拖进 zstd-sys 这个
# 带 C 代码的依赖（见 tools/build-desktop.ps1 里为它写的 TEMP 绕行）。
#
# 现在词库是数据文件夹里的一份普通文件（用户可增删替换），由 `vocfreq_core::dict`
# 负责读取、校验与装载，命令行与桌面端走的是同一条路径。
jieba-rs = { version = "0.11", default-features = false }
# 词库内容指纹（写进 meta.json 的 `DictRef.sha256`），用来判断"这张表是基于哪份词库生成的"。
# 不是安全用途，但要求跨版本稳定 —— 所以不能用 std 的 DefaultHasher（它不保证跨版本一致）。
sha2 = "0.10"
rayon = "1"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memmap2 = "0.9"
clap = { version = "4", features = ["derive"] }
walkdir = "2"
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "none"

# 全库统计是长任务，调试构建太慢，这里给 dev 也开优化
[profile.dev]
opt-level = 1
