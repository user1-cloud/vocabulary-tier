<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>VocTier 字词频率分析</title>
    <script>
      // 首屏防闪烁：在 CSS 加载前就把主题 class 打到 <html> 上
      // 与 src/lib/theme.svelte.ts 中的 readStoredTheme() 保持同一套 key
      (function () {
        try {
          var stored = localStorage.getItem('voctier-theme');
          var dark =
            stored === 'dark' ||
            (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          // 同理先把界面语言的 <html lang> 落上（key 见 src/lib/i18n.svelte.ts）。
          // 标题不在这里改：本地化标题要查消息表，交给 main.ts 里的 applyLocaleToDocument()。
          var loc = localStorage.getItem('voctier-locale');
          if (loc) document.documentElement.lang = loc;
        } catch (e) {
          /* 忽略：隐私模式下 localStorage 不可用 */
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
