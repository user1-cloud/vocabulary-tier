[package]
name = "voctier-desktop"
version = "0.1.0"
description = "VocTier 字词频率分析 桌面端"
authors = ["VocTier"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

# ⚠️ 重要：这是一个「独立 workspace」。
#
# 上层目录（<仓库根>\Cargo.toml）是一个 Cargo workspace（members 只包含
# crates/vocfreq-core 和 crates/vocfreq-cli）。Cargo 会向上查找 workspace 根，
# 如果不加这个空的 [workspace] 表，会报 "current package believes it's in a
# workspace when it's not" 或者被强行拉进上层 workspace。
[workspace]

[lib]
name = "voctier_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"

# 统计引擎。Tauri 侧与分析/查询共用同一个 core crate，
# 因此「命令行工具」与「桌面端」产出的结果与分词粒度必然一致。
vocfreq-core = { path = "../../../crates/vocfreq-core" }

# 全局取词：剪贴板暂存与还原
arboard = "3"

[target.'cfg(windows)'.dependencies]
# 模拟 Ctrl+C。只用到 SendInput 与 GetClipboardSequenceNumber，
# 不引入整个 windows crate。
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# UI Automation：**直接读取**焦点元素的选中文本，不合成任何按键。
#
# 为什么需要它：`SendInput` 注入的 Ctrl+C 在某些环境里会被**静默丢弃**——
# SendInput 照样返回成功、前台窗口和修饰键状态都正常、剪贴板却毫无变化。
# 实测在同一台机器上，pwsh 进程注入同样的事件有效，而本应用注入完全无效，
# 且与调用线程（主线程/后台线程）、启动方式（会话内/资源管理器）都无关，
# 具体机制未能查明。UIA 走的是跨进程 COM 读取，与合成输入是完全不同的通路，
# 因此不受该问题影响；顺带还避免了「污染用户剪贴板」这个副作用。
#
# 注：windows-sys 不含 UIA 绑定（更不含 COM 智能指针），所以只能用 windows crate。
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Accessibility",
] }
