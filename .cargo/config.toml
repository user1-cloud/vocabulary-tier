# ============================================================================
# 仓库级 cargo 配置
# ============================================================================

# ---------------------------------------------------------------------------
# 把构建临时目录钉在工作区内 —— 修 zstd-sys 的 D8050 / LNK1104
# ---------------------------------------------------------------------------
#
# 症状（`cc` 通过 cc-rs 拉起 MSVC 编译 zstd 的 C 源码时）：
#
#   cl: 命令行 error D8050 :无法执行"…\c1.dll": 未能将命令行放入调试记录中
#   LINK : fatal error LNK1104: 无法打开文件"…\AppData\Local\Temp\lnk{guid}.tmp"
#
# 36 个 .c 全挂，cargo 退出 101；而**手动**用同样的 cl、同样的参数、同样的
# vcvars 跑同一条命令**永远成功**。
#
# 实测（每次先 `cargo clean -p zstd-sys`，只改 TMP/TEMP 一个变量）：
#
#   TMP/TEMP = %LOCALAPPDATA%\Temp          → 失败，D8050 ×36
#   TMP/TEMP = C:\vtmp（极短路径）           → 失败，D8050 ×36
#   TMP/TEMP = E:\VocTierTmpProbe            → 失败，D8050 ×36
#   TMP/TEMP = <仓库父目录>\VocTierTmpProbe   → 失败，D8050 ×36
#   TMP/TEMP = <仓库>\.tmp                   → ✅ 成功（36 个 .o，退出码 0，20 秒）
#
# 也就是说：**只认工作区这一条边界**，与盘符、路径长度、目录是否干净都无关；
# 且由计划任务（脱离 agent 会话的进程树）跑同样会失败，所以不是某个会话的沙箱。
#
# 下面的 [env] 让 cargo 在**执行 build script 时**自动设置这两个变量，
# 于是 `cargo build`、`cargo test`、`pnpm tauri dev`、`pnpm tauri build`
# 全部自动生效，不需要任何人记得先手设环境变量。
#
# `relative = true` 表示路径相对本文件所在目录解析，因此这里写 ".tmp"
# 就是 <仓库根>\.tmp —— 换机器、换盘符都不用改。
#
# `force = true` 是**必需**的：TMP/TEMP 在系统里本来就已设置，而 cargo 的
# `[env]` 默认「已存在的环境变量不覆盖」，不写 force 等于没配（第一版就踩了这个）。
[env]
TMP = { value = ".tmp", relative = true, force = true }
TEMP = { value = ".tmp", relative = true, force = true }
